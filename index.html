ontroll fenyegető elvesztését jelenti. Az orvosi kezelés igénybevétele is kontrollvesztésnek minősül, mert az orvos kezelésétől válik függővé a gyógyulásuk.","o":["Elkerülő személyiség","Dependens személyiség","Borderline személyiségzavar","Kényszeres személyiség","Nárcisztikus személyiség"],"a":[3]},{"t":"s","q":"Melyik személyiségre jellemzőek az alábbi állítások? Törekvésük a tökéletességre, és a tökéletes kontrollra megkönnyítheti az együttműködést, mert az orvosi utasításokat a legutolsó részletig, pontosan betartják. Azonban, ugyanez a tulajdonságuk nehézségeket is okozhat, mert az orvosoktól tökéletes ellátást, a legpontosabb, és részletekbe menő tájékoztatást várnak el. Amennyiben ezt nem kapják meg, sokszor kritikusakká válnak, az orvos munkáját, tudását, szakértelmét megkérdőjelezik és megszakítják az együttműködést.","o":["Elkerülő személyiség","Dependens személyiség","Borderline személyiségzavar","Kényszeres személyiség","Nárcisztikus személyiség"],"a":[3]},{"t":"s","q":"Melyik személyiségre jellemzőek az alábbi állítások? Mindent megtesznek azért, hogy felsőbbrendű státuszukat fenntartsák. Hajszolják a dicsőséget, a gazdagságot, a pozíciót, a hatalmat és a presztízst, hogy megerősítsék felsőbbrendűségük látszatát. Versenyre kelnek azokkal, akik egyenrangúnak állítják be magukat. Azt hiszik, bármit megengedhetnek maguknak, mivel a többiek felett állnak. Arrogáns, követelőző, felsőbbrendű magatartásuk azonnal árulkodik a problémáról.","o":["Elkerülő személyiség","Dependens személyiség","Borderline személyiségzavar","Kényszeres személyiség","Nárcisztikus személyiség"],"a":[4]},{"t":"s","q":"Melyik személyiségre jellemzőek az alábbi állítások? Az első találkozáskor az orvos beosztása, pozíciója iránt érdeklődnek. Többnyire nem engedik, hogy orvostanhallgatók, rezidensek, vagy frissen végzett szakorvosok vizsgálják meg őket. Vezető pozícióban levő szakemberek figyelmét igénylik. Leértékelik a szerintük alacsony státuszban levő orvosokat, és idealizálják azokat, akik szerintük elég magasan állnak a ranglétrán.","o":["Elkerülő személyiség","Dependens személyiség","Borderline személyiségzavar","Kényszeres személyiség","Nárcisztikus személyiség"],"a":[4]},{"t":"s","q":"Melyik személyiségre jellemzőek az alábbi állítások? Magukat sérülékenynek tartják. Elvesztették bizalmukat a többi emberben. Azt feltételezik, hogy a többi ember rejtett szándéka az, hogy őket manipulálja, kihasználja, bántalmazza. Ha megbetegszenek, a betegség és az abból fakadó kiszolgáltatottság fokozza gyanakvásukat és ellenségességüket. A kezelő személyzettel szemben is gyanakvóak. Az orvosi beavatkozásokat időnként indokolatlannak és ártalmasnak vélik.","o":["Paranoid személyiség","Antiszociális személyiség","Narcisztikus személyiség","Hisztrionikus személyiség","Szkizoid személyiségzavar"],"a":[0]},{"t":"s","q":"Melyik személyiségre jellemzőek az alábbi állítások? Az orvosi beavatkozások során előfordulhat, hogy bizonyos gesztusokat, beavatkozásokat félreértenek és ellenük irányuló támadásnak élik meg. Ilyenkor viselkedésük ellenségessé válhat, vádaskodni kezdenek az orvossal.","o":["Paranoid személyiség","Antiszociális személyiség","Narcisztikus személyiség","Hisztrionikus személyiség","Szkizoid személyiségzavar"],"a":[0]},{"t":"s","q":"Melyik személyiségre jellemzőek az alábbi állítások? Az orvosi ellátás során főleg akkor jelentenek problémát, ha az orvost rá akarják bírni, hogy olyan ellátást adjon nekik, olyan gyógyszert írjon fel, vagy olyan hivatalos papírokat állítson ki nekik, amelyek orvosi szempontból nem indokoltak. Ha az orvos szakmailag helyesen jár el, és nemet mond ezekre a kérésekre, könnyen indulatba jönnek, követelőzni, majd fenyegetőzni kezdenek, az erőszakos cselekedet sem kizárt.","o":["Paranoid személyiség","Antiszociális személyiség","Narcisztikus személyiség","Hisztrionikus személyiség","Szkizoid személyiségzavar"],"a":[1]},{"t":"s","q":"Melyik személyiségre jellemzőek az alábbi állítások? Az ilyen személyiségek meghatározó k   if(!q.a.length){res.innerText="Ehhez a kérdéshez nincs megjelölt jó válasz a forrásban, ezért nem tudom ellenőrizni.";res.className="nokey";res.style.display="block";
   $("check-btn").style.display="none";$("next-btn").style.display="block";answered=true;return}
  const A=[...q.a].sort().join(),C=chosen.sort().join();ok=A===C;
  [...labels].forEach((l,i)=>{if(q.a.includes(i))l.className="ok";else if(chosen.includes(i))l.className="bad"});
  txt=ok?"HELYES! ✅":"HELYTELEN! ❌\nA jó válasz: "+q.a.map(i=>q.o[i]).join("; ");
 }
 answered=true;scored++;if(ok)score++;
 res.innerText=txt;res.className=ok?"correct":"wrong";res.style.display="block";
 $("check-btn").style.display="none";$("next-btn").style.display="block";
}
function next(){cur++;if(cur<list.length)load();else finish()}
function finish(){
 $("quiz-ui").style.display="none";$("end").style.display="block";
 $("end-title").innerText=deck==="main"?"Vége a tesztnek!":"Vége a Nehéz paklinak!";
 $("score").innerText=scored?scored+" ellenőrzött kérdésből "+score+" helyes!":"";
 const b=$("end-btns");b.innerHTML="";
 const r=el("button","",deck==="main"?"Újrakezdés":"Pakli újra");r.onclick=()=>{if(deck==="main"){st.pos=0;save()}setDeck(deck)};b.appendChild(r);
 const o=el("button","",deck==="main"?"⭐ Nehéz pakli":"📚 Fő pakli");o.onclick=()=>setDeck(deck==="main"?"hard":"main");b.appendChild(o);updDecks()}
function jump(){const j=parseInt($("jump-in").value)-1;
 if(deck==="hard"){const k=list.indexOf(j);if(k>=0){cur=k;load()}else alert("Ez a kérdés nincs a Nehéz pakliban.");return}
 if(j>=0&&j<qs.length){cur=j;load()}else alert("Érvénytelen sorszám! (1-"+qs.length+")")}
setDeck("main");
</script>
</body>
</html>
